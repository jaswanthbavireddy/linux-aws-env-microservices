name: linux-aws-env

services:
  user-service:
    build:
      context: ./user-service
    image: 482311061089.dkr.ecr.us-east-1.amazonaws.com/linux-aws-env/user-service:v1
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  product-service:
    build:
      context: ./product-service
    image: 482311061089.dkr.ecr.us-east-1.amazonaws.com/linux-aws-env/product-service:v1
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  order-service:
    build:
      context: ./order-service
    image: 482311061089.dkr.ecr.us-east-1.amazonaws.com/linux-aws-env/order-service:v1
    ports:
      - "127.0.0.1:8003:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s